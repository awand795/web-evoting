<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Web E-Voting</title>
  <meta name="description" content="Masuk ke platform E-Voting untuk mulai voting.">
  <link rel="stylesheet" href="/resources/static/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗳️</text></svg>">
</head>
<body>
  <!-- Animated Background -->
  <div class="animated-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="/resources/static/index.html" class="logo">E<span>-Voting</span></a>
      <div class="nav-links" id="navLinks">
        <a href="/resources/static/index.html">Beranda</a>
        <a href="/resources/static/index.html#about">Tentang</a>
        <a href="/resources/static/login.html" class="btn-nav">Masuk</a>
      </div>
      <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- Login Section -->
  <section class="login-page">
    <div class="login-container">
      <div class="login-header">
        <div class="login-logo">🗳️</div>
        <h1>Selamat Datang</h1>
        <p>Masuk untuk mulai voting</p>
      </div>

      <!-- Error Message -->
      <div class="error-message" id="errorMessage"></div>

      <!-- Login Form -->
      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Masukkan username"
              required
              autocomplete="username"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password"
              required
              autocomplete="current-password"
            />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan password">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginButton">
          <span class="btn-text">Masuk</span>
          <span class="spinner"></span>
        </button>
      </form>

      <!-- Demo Account -->
      <div class="demo-account">
        <h3>🎯 Akun Demo</h3>
        <div class="demo-details">
          <span><strong>Username:</strong> <code id="demoUsername">demo</code></span>
          <span><strong>Password:</strong> <code id="demoPassword">demo123</code></span>
        </div>
        <button type="button" class="btn-demo" id="demoLoginBtn">
          🔑 Login dengan Akun Demo
        </button>
      </div>

      <div class="login-footer">
        <p>Kembali ke <a href="/resources/static/index.html">Beranda</a></p>
      </div>
    </div>
  </section>

  <script src="/resources/static/js/auth.js"></script>
  <script src="/resources/static/js/main.js"></script>
</body>
</html>
